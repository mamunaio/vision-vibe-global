<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <rect width="400" height="260" fill="#F0F4F8"/>
  <rect x="20" y="20" width="360" height="220" fill="#FFFFFF" stroke="#E2E8F0" rx="4"/>
  <!-- Operational flow diagram -->
  <g transform="translate(45, 60)">
    <rect x="0" y="40" width="70" height="60" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.5" rx="3"/>
    <text x="35" y="75" fill="#1D4ED8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Input</text>
    
    <line x1="70" y1="70" x2="110" y2="70" stroke="#1D4ED8" stroke-width="2"/>
    <polygon points="110,66 118,70 110,74" fill="#1D4ED8"/>

    <rect x="120" y="20" width="90" height="100" fill="#0B1622" rx="3"/>
    <text x="165" y="65" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Agile Core</text>
    <text x="165" y="85" fill="#C5A880" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Lean Engine</text>

    <line x1="210" y1="70" x2="250" y2="70" stroke="#1D4ED8" stroke-width="2"/>
    <polygon points="250,66 258,70 250,74" fill="#1D4ED8"/>

    <rect x="260" y="40" width="70" height="60" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.5" rx="3"/>
    <text x="295" y="75" fill="#1D4ED8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Output</text>
  </g>
  <text x="200" y="210" fill="#64748B" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Continuous Process Optimization & Lean Redesign</text>
</svg>
