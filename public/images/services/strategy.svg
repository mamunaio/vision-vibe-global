<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <rect width="400" height="260" fill="#F0F4F8"/>
  <rect x="20" y="20" width="360" height="220" fill="#FFFFFF" stroke="#E2E8F0" rx="4"/>
  <!-- Strategy matrix graphic -->
  <line x1="60" y1="200" x2="340" y2="200" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="60" y1="50" x2="60" y2="200" stroke="#CBD5E1" stroke-width="1.5"/>
  <!-- Quadrants -->
  <rect x="80" y="70" width="110" height="55" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" rx="3"/>
  <text x="135" y="102" fill="#1D4ED8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Growth Engines</text>
  
  <rect x="210" y="70" width="110" height="55" fill="#1D4ED8" rx="3"/>
  <text x="265" y="102" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Market Leader</text>

  <rect x="80" y="135" width="110" height="50" fill="#F8FAFC" stroke="#E2E8F0" rx="3"/>
  <text x="135" y="165" fill="#64748B" font-family="system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Foundational</text>

  <rect x="210" y="135" width="110" height="50" fill="#F8FAFC" stroke="#E2E8F0" rx="3"/>
  <text x="265" y="165" fill="#64748B" font-family="system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Emerging Horizon</text>
</svg>
